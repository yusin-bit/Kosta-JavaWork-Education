<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 입력 — Servlet 실습</title>
</head>
<body>
    <h1>로그인 입력</h1>
    <p>아이디를 입력하고 전송하면 결과를 JSP 화면으로 보여줍니다.</p>
    <p>아이디가 비어 있으면 이 로그인 화면으로 돌아옵니다.</p>
    
   
    <form action="test" method="get">
  		<label for="id">아이디:</label>
  		<input type="text" id="id" name="id"/>
  		<input type="submit" value="로그인"/>
  		 
    </form>
    
</body>
</html>
